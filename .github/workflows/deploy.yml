name: Deploy to GCLOUD

on:
  push:
    branches:
      - main

concurrency:
  group: "deploy-to-gcloud"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KEY_PUB }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.VM_IP }}" >> ~/.ssh/known_hosts

      - name: Checking Typing
        run: |
          ssh -t -i ~/.ssh/id_rsa "${{ secrets.SSH_CON }}" << 'EOF'
            cd ..
            cd shared
            cd docx-backend
            npm run check:build
          EOF
        continue-on-error: false

      - name: Deploying
        run: |
          ssh -t -i ~/.ssh/id_rsa "${{ secrets.SSH_CON }}" << 'EOF'
            cd ..
            cd shared
            cd docx-backend
            npm run deploy
          EOF